<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruleta al Azar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&family=Redaction+50:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        /* Estilos base limpios y autocontenidos (funcionan 100% offline / file://) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Redaction 50', 'Special Elite', Georgia, serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #2A0000;
            /* Si quieres poner una imagen de fondo, quita las barras /* y */ de las siguientes 3 líneas y pon el nombre de tu imagen: */
            /* background-image: url('tu-imagen.jpg'); */
            /* background-size: cover; */
            /* background-position: center; */
            color: #FFF5F3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background-color: #480301;
            border: 1px solid #6A0000;
            min-height: 100vh;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 640px) {
            body {
                align-items: center;
                padding: 24px;
            }
            .container {
                min-height: auto;
                border-radius: 0;
                border: 2px solid #A63E30;
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
            }
        }

        h1 {
            font-family: 'Bevan', Georgia, serif;
            font-size: 1.45rem;
            font-weight: 400;
            text-align: center;
            color: #FFF5F3;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .label-row label {
            color: #E57461;
        }

        .label-row span {
            color: #A63E30;
        }

        textarea {
            width: 100%;
            padding: 14px;
            border-radius: 0;
            background-color: #2A0000;
            border: 1.5px solid #A63E30;
            font-family: 'Special Elite', 'Redaction 50', monospace;
            font-size: 1rem;
            line-height: 1.5;
            color: #FFF5F3;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea::placeholder {
            color: #A63E30;
            opacity: 0.75;
        }

        textarea:focus {
            border-color: #E57461;
            box-shadow: 0 0 0 2px rgba(229, 116, 97, 0.25);
        }

        .status-msg {
            font-size: 0.8rem;
            text-align: center;
            color: #E57461;
            font-weight: 600;
            display: none;
        }

        .status-msg.visible {
            display: block;
        }

        /* Contenedor de la ruleta y aguja afilada superior */
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1 / 1;
            margin: 6px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pointer {
            position: absolute;
            top: -115px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.65));
        }

        .pointer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #A63E30;
            background-color: #2A0000;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
        }

        /* Botón principal Girar con cortes afilados */
        .spin-btn {
            width: 100%;
            padding: 16px;
            border: 1.5px solid #E57461;
            border-radius: 0;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            background-color: #A63E30;
            color: #FFF5F3;
            font-family: 'Bevan', Georgia, serif;
            font-size: 1.15rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, transform 0.1s, opacity 0.2s;
        }

        .spin-btn:hover:not(:disabled) {
            background-color: #E57461;
            color: #2A0000;
        }

        .spin-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .spin-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* Ventana emergente (Modal) afilada para el ganador */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            background-color: rgba(20, 0, 0, 0.85);
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            width: 100%;
            max-width: 320px;
            background-color: #480301;
            border: 2px solid #E57461;
            border-radius: 0;
            clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
            padding: 26px 24px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75);
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #E57461;
            font-weight: 800;
        }

        .modal-winner {
            font-family: 'Bevan', Georgia, serif;
            font-size: 1.65rem;
            font-weight: 400;
            color: #FFF5F3;
            margin: 16px 0 22px;
            word-break: break-word;
            line-height: 1.3;
        }

        .close-btn {
            width: 100%;
            padding: 13px;
            border: 1px solid #E57461;
            border-radius: 0;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            background-color: #A63E30;
            color: #FFF5F3;
            font-family: 'Bevan', Georgia, serif;
            font-size: 0.95rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, transform 0.1s;
        }

        .close-btn:hover {
            background-color: #E57461;
            color: #2A0000;
        }

        .close-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Ruleta al Azar</h1>

        <!-- Cuadro de texto multilínea -->
        <div class="input-group">
            <div class="label-row">
                <label for="optionsBox">Escribe un elemento por renglón:</label>
                <span id="countText">3 opciones</span>
            </div>
            <textarea id="optionsBox" rows="5" placeholder="Opción 1&#10;Opción 2&#10;Opción 3">Opción 1
Opción 2
Opción 3</textarea>
        </div>

        <p id="statusMsg" class="status-msg"></p>

        <!-- Ruleta y aguja -->
        <div class="wheel-wrapper">
            <div class="pointer" aria-hidden="true">
                <img
                    id="pointerImg"
                    src="aguja.png"
                    alt="Aguja lengua de gato"
                    onerror="this.onerror=null; this.src='https://placehold.co/34x46/E57461/2A0000?text=V';"
                >
            </div>
            <canvas id="wheelCanvas" width="300" height="300"></canvas>
        </div>

        <!-- Botón para girar -->
        <button id="spinBtn" type="button" class="spin-btn">Girar</button>
    </main>

    <!-- Ventana emergente para mostrar al ganador -->
    <div id="winnerModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card">
            <p id="modalTitle" class="modal-subtitle">¡Opción ganadora!</p>
            <p id="modalWinnerText" class="modal-winner">—</p>
            <button id="closeModalBtn" type="button" class="close-btn">Cerrar</button>
        </div>
    </div>

    <script>
        (function () {
            let options = [];
            let currentAngle = 0;
            let isSpinning = false;

            const colors = [
                '#480301',
                '#A63E30',
                '#6A0000',
                '#E57461'
            ];

            const optionsBox = document.getElementById('optionsBox');
            const countText = document.getElementById('countText');
            const statusMsg = document.getElementById('statusMsg');
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const spinBtn = document.getElementById('spinBtn');
            const winnerModal = document.getElementById('winnerModal');
            const modalWinnerText = document.getElementById('modalWinnerText');
            const closeModalBtn = document.getElementById('closeModalBtn');

            function updateOptions() {
                options = optionsBox.value
                    .split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0);

                countText.textContent = `${options.length} ${options.length === 1 ? 'opción' : 'opciones'}`;
                spinBtn.disabled = options.length < 2 || isSpinning;

                if (options.length < 2) {
                    statusMsg.textContent = 'Escribe al menos 2 opciones para poder girar.';
                    statusMsg.classList.add('visible');
                } else {
                    statusMsg.classList.remove('visible');
                }

                drawWheel();
            }

            function drawWheel() {
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                const size = rect.width > 0 ? rect.width : 300;

                if (canvas.width !== size * dpr || canvas.height !== size * dpr) {
                    canvas.width = size * dpr;
                    canvas.height = size * dpr;
                }

                ctx.save();
                ctx.scale(dpr, dpr);
                ctx.clearRect(0, 0, size, size);

                const center = size / 2;
                const radius = center;

                // Estado vacío si no hay opciones
                if (options.length === 0) {
                    ctx.beginPath();
                    ctx.arc(center, center, radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#2A0000';
                    ctx.fill();

                    ctx.fillStyle = '#E57461';
                    ctx.font = '400 14px "Special Elite", "Redaction 50", serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('Escribe opciones arriba', center, center);
                    ctx.restore();
                    return;
                }

                const sliceAngle = (Math.PI * 2) / options.length;

                for (let i = 0; i < options.length; i++) {
                    const startAngle = currentAngle + i * sliceAngle;
                    const endAngle = startAngle + sliceAngle;

                    // Evitar que la última rebanada repita el color de la primera si hay > 2 opciones
                    let colorIndex = i % colors.length;
                    if (options.length > 2 && i === options.length - 1 && colorIndex === 0) {
                        colorIndex = 1;
                    }
                    const sliceColor = colors[colorIndex];

                    // Dibujar rebanada
                    ctx.beginPath();
                    ctx.moveTo(center, center);
                    ctx.arc(center, center, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fillStyle = sliceColor;
                    ctx.fill();

                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#2A0000';
                    ctx.stroke();

                    // Dibujar texto dentro de la rebanada con alto contraste
                    ctx.save();
                    ctx.translate(center, center);
                    ctx.rotate(startAngle + sliceAngle / 2);

                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = sliceColor === '#E57461' ? '#2A0000' : '#FFF5F3';

                    const fontSize = options.length > 12 ? 11 : options.length > 8 ? 13 : 15;
                    ctx.font = `400 ${fontSize}px "Special Elite", "Redaction 50", serif`;

                    let label = options[i];
                    const maxChars = options.length > 10 ? 12 : 16;
                    if (label.length > maxChars) {
                        label = label.slice(0, maxChars - 1) + '…';
                    }

                    ctx.fillText(label, radius - 14, 0);
                    ctx.restore();
                }

                // Centro en forma de diamante / estrella afilada
                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(currentAngle);
                ctx.beginPath();
                ctx.moveTo(0, -18);
                ctx.lineTo(18, 0);
                ctx.lineTo(0, 18);
                ctx.lineTo(-18, 0);
                ctx.closePath();
                ctx.fillStyle = '#480301';
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#E57461';
                ctx.stroke();
                ctx.restore();

                ctx.restore();
            }

            // Girar suavemente durante ~3.5 segundos
            function spinWheel() {
                if (isSpinning || options.length < 2) return;

                isSpinning = true;
                spinBtn.disabled = true;
                optionsBox.disabled = true;

                const startAngle = currentAngle;
                const extraSpins = 5 + Math.random() * 3;
                const targetAngle = startAngle + extraSpins * Math.PI * 2 + Math.random() * Math.PI * 2;
                const duration = 3500;
                const startTime = performance.now();

                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 4);

                    currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
                    drawWheel();

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        currentAngle = currentAngle % (Math.PI * 2);
                        isSpinning = false;
                        spinBtn.disabled = false;
                        optionsBox.disabled = false;
                        showWinner();
                    }
                }

                requestAnimationFrame(animate);
            }

            // Calcular opción bajo la flecha superior (-90° / 3π/2) y abrir modal
            function showWinner() {
                const sliceAngle = (Math.PI * 2) / options.length;
                const pointerAngle = (Math.PI * 1.5 - currentAngle % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2);
                const winningIndex = Math.floor(pointerAngle / sliceAngle) % options.length;

                modalWinnerText.textContent = options[winningIndex];
                winnerModal.classList.add('open');
            }

            function closeModal() {
                winnerModal.classList.remove('open');
            }

            optionsBox.addEventListener('input', updateOptions);
            spinBtn.addEventListener('click', spinWheel);
            closeModalBtn.addEventListener('click', closeModal);
            winnerModal.addEventListener('click', function (e) {
                if (e.target === winnerModal) closeModal();
            });
            window.addEventListener('resize', drawWheel);
            window.addEventListener('load', updateOptions);

            updateOptions();
        })();
    </script>
</body>
</html>
