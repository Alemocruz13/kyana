<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kyanaleta</title>
    <!-- Ícono de la pestaña (Favicon) -->
    <link rel="icon" type="image/png" href="centro1.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&family=Pixelify+Sans:wght@400..700&family=Redaction+50:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pixelify Sans', 'Special Elite', 'Redaction 50', monospace, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #2A0000;
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #FFF5F3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background-color: rgba(72, 3, 1, 0.8);
            border: 3px solid #E57461;
            border-radius: 8px;
            box-shadow: 0 0 0 3px #480301, 0 12px 32px rgba(0, 0, 0, 0.65);
            min-height: 100vh;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 640px) {
            body {
                align-items: center;
                padding: 24px;
            }
            .container {
                min-height: auto;
            }
        }

        h1 {
            font-family: 'Pixelify Sans', 'Special Elite', 'Redaction 50', monospace, sans-serif;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            color: #FFF5F3;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-shadow: 2px 2px #2A0000;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .label-row label {
            color: #E57461;
        }

        .label-row span {
            color: #A63E30;
        }

        textarea {
            width: 100%;
            padding: 14px;
            background-color: #2A0000;
            border: 2px solid #A63E30;
            border-radius: 4px;
            font-family: 'Pixelify Sans', 'Special Elite', 'Redaction 50', monospace, sans-serif;
            font-size: 1.15rem;
            line-height: 1.5;
            color: #FFF5F3;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea::placeholder {
            color: #A63E30;
            opacity: 0.75;
        }

        textarea:focus {
            border-color: #E57461;
            box-shadow: 0 0 0 2px rgba(229, 116, 97, 0.3);
        }

        .status-msg {
            font-size: 0.9rem;
            text-align: center;
            color: #E57461;
            font-weight: 600;
            display: none;
        }

        .status-msg.visible {
            display: block;
        }

        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1 / 1;
            margin: 6px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pointer {
            position: absolute;
            top: -117px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.65));
        }

        .pointer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #A63E30;
            background-color: #2A0000;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
            image-rendering: pixelated;
            cursor: pointer; /* Muestra que se puede presionar */
            transition: transform 0.1s;
        }

        canvas:active:not(.spinning) {
            transform: scale(0.98);
        }

        /* Ventana emergente (Modal) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            background-color: rgba(20, 0, 0, 0.85);
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            width: 100%;
            max-width: 320px;
            background-color: #480301;
            border: 3px solid #E57461;
            border-radius: 8px;
            box-shadow: 0 0 0 3px #2A0000, 0 18px 40px rgba(0, 0, 0, 0.75);
            padding: 26px 24px;
            text-align: center;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-subtitle {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #E57461;
            font-weight: 700;
        }

        .modal-winner {
            font-family: 'Pixelify Sans', 'Special Elite', 'Redaction 50', monospace, sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #FFF5F3;
            margin: 16px 0 22px;
            word-break: break-word;
            line-height: 1.3;
            text-shadow: 2px 2px #2A0000;
        }

        .close-btn {
            width: 100%;
            padding: 13px;
            border: 2px solid #E57461;
            border-radius: 6px;
            background-color: #A63E30;
            color: #FFF5F3;
            font-family: 'Pixelify Sans', 'Special Elite', 'Redaction 50', monospace, sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            cursor: pointer;
            box-shadow: 0 3px 0 #2A0000;
            transition: background-color 0.1s, transform 0.1s, box-shadow 0.1s;
        }

        .close-btn:hover {
            background-color: #E57461;
            color: #2A0000;
        }

        .close-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #2A0000;
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Kyanaleta</h1>

        <div class="input-group">
            <div class="label-row">
                <label for="optionsBox">Elemento por renglón:</label>
                <span id="countText">3 opciones</span>
            </div>
            <textarea id="optionsBox" rows="5" placeholder="Opción 1&#10;Opción 2&#10;Opción 3">Opción 1
Opción 2
Opción 3</textarea>
        </div>

        <p id="statusMsg" class="status-msg"></p>

        <!-- Ruleta y aguja (Ahora al hacer clic sobre el canvas gira) -->
        <div class="wheel-wrapper">
            <div class="pointer" aria-hidden="true">
                <img
                    id="pointerImg"
                    src="aguja.png"
                    alt="Aguja lengua de gato"
                    onerror="this.onerror=null; this.src='https://placehold.co/34x46/E57461/2A0000?text=V';"
                >
            </div>
            <canvas id="wheelCanvas" width="300" height="300"></canvas>
        </div>
    </main>

    <div id="winnerModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card">
            <p id="modalTitle" class="modal-subtitle">¡Opción ganadora!</p>
            <p id="modalWinnerText" class="modal-winner">—</p>
            <button id="closeModalBtn" type="button" class="close-btn">Cerrar</button>
        </div>
    </div>

    <script>
        (function () {
            let options = [];
            let currentAngle = 0;
            let isSpinning = false;

            const colors = [
                '#480301',
                '#A63E30',
                '#6A0000'
            ];

            const imgOficial = new Image();
            imgOficial.src = 'centro1.png';

            const imgEasterEgg = new Image();
            imgEasterEgg.src = 'centro.png';

            let currentCenterImg = imgOficial;

            imgOficial.onload = drawWheel;
            imgEasterEgg.onload = drawWheel;

            const optionsBox = document.getElementById('optionsBox');
            const countText = document.getElementById('countText');
            const statusMsg = document.getElementById('statusMsg');
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const winnerModal = document.getElementById('winnerModal');
            const modalWinnerText = document.getElementById('modalWinnerText');
            const closeModalBtn = document.getElementById('closeModalBtn');

            function updateOptions() {
                options = optionsBox.value
                    .split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0);

                countText.textContent = `${options.length} ${options.length === 1 ? 'opción' : 'opciones'}`;

                if (options.length < 2) {
                    statusMsg.textContent = 'Escribe al menos 2 opciones para poder girar.';
                    statusMsg.classList.add('visible');
                } else {
                    statusMsg.classList.remove('visible');
                }

                drawWheel();
            }

            function drawWheel() {
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                const size = rect.width > 0 ? rect.width : 300;

                if (canvas.width !== size * dpr || canvas.height !== size * dpr) {
                    canvas.width = size * dpr;
                    canvas.height = size * dpr;
                }

                ctx.save();
                ctx.scale(dpr, dpr);
                ctx.clearRect(0, 0, size, size);

                const center = size / 2;
                const radius = center;

                if (options.length === 0) {
                    ctx.beginPath();
                    ctx.arc(center, center, radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#2A0000';
                    ctx.fill();

                    ctx.fillStyle = '#E57461';
                    ctx.font = '700 15px "Pixelify Sans", monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('Escribe opciones arriba', center, center);
                    ctx.restore();
                    return;
                }

                const sliceAngle = (Math.PI * 2) / options.length;

                for (let i = 0; i < options.length; i++) {
                    const startAngle = currentAngle + i * sliceAngle;
                    const endAngle = startAngle + sliceAngle;

                    let colorIndex = i % colors.length;
                    if (options.length > 2 && i === options.length - 1 && colorIndex === 0) {
                        colorIndex = 1;
                    }
                    const sliceColor = colors[colorIndex];

                    ctx.beginPath();
                    ctx.moveTo(center, center);
                    ctx.arc(center, center, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fillStyle = sliceColor;
                    ctx.fill();

                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#2A0000';
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(center, center);
                    ctx.rotate(startAngle + sliceAngle / 2);

                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#FFF5F3';

                    const fontSize = options.length > 12 ? 13 : options.length > 8 ? 15 : 17;
                    ctx.font = `700 ${fontSize}px "Pixelify Sans", monospace`;

                    let label = options[i];
                    const maxChars = options.length > 10 ? 12 : 16;
                    if (label.length > maxChars) {
                        label = label.slice(0, maxChars - 1) + '…';
                    }

                    ctx.fillText(label, radius - 14, 0);
                    ctx.restore();
                }

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(currentAngle);

                const imgSize = 75;
                
                if (currentCenterImg.complete && currentCenterImg.naturalHeight !== 0) {
                    ctx.drawImage(currentCenterImg, -imgSize / 2, -imgSize / 2, imgSize, imgSize);
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, imgSize / 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#480301';
                    ctx.fill();
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = '#E57461';
                    ctx.stroke();
                }
                ctx.restore();

                ctx.restore();
            }

            function spinWheel() {
                if (isSpinning || options.length < 2) return;

                isSpinning = true;
                optionsBox.disabled = true;

                if (Math.random() < 0.15) {
                    currentCenterImg = imgEasterEgg;
                } else {
                    currentCenterImg = imgOficial;
                }

                const startAngle = currentAngle;
                const extraSpins = 5 + Math.random() * 3;
                const targetAngle = startAngle + extraSpins * Math.PI * 2 + Math.random() * Math.PI * 2;
                const duration = 3500;
                const startTime = performance.now();

                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 4);

                    currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
                    drawWheel();

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        currentAngle = currentAngle % (Math.PI * 2);
                        isSpinning = false;
                        optionsBox.disabled = false;
                        showWinner();
                    }
                }

                requestAnimationFrame(animate);
            }

            function showWinner() {
                const sliceAngle = (Math.PI * 2) / options.length;
                const pointerAngle = (Math.PI * 1.5 - currentAngle % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2);
                const winningIndex = Math.floor(pointerAngle / sliceAngle) % options.length;

                modalWinnerText.textContent = options[winningIndex];
                winnerModal.classList.add('open');
            }

            function closeModal() {
                winnerModal.classList.remove('open');
            }

            optionsBox.addEventListener('input', updateOptions);
            
            // Evento para girar al hacer clic directamente sobre la ruleta (canvas)
            canvas.addEventListener('click', spinWheel);

            closeModalBtn.addEventListener('click', closeModal);
            winnerModal.addEventListener('click', function (e) {
                if (e.target === winnerModal) closeModal();
            });
            window.addEventListener('resize', drawWheel);
            window.addEventListener('load', updateOptions);

            updateOptions();
        })();
    </script>
</body>
</html>
